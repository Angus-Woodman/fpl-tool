[project]
name = "fpl-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.9.2",
  "numpy==2.1.1",
  "scipy==1.14.1",
  "pandas==2.2.2",
]

[dependency-groups]
dev = [
  "pytest==8.3.2",
  "mypy==1.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fpl_engine"]
