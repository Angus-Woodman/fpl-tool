name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Python dependencies
        run: uv sync --all-packages --dev
      - name: Ruff
        run: uv run ruff check apps/api/src apps/api/tests packages/fpl_engine/src packages/fpl_engine/tests
      - name: Mypy (engine)
        run: uv run --package fpl-engine mypy --config-file packages/fpl_engine/pyproject.toml packages/fpl_engine/src
      - name: Mypy (api)
        run: MYPYPATH=packages/fpl_engine/src uv run --package api mypy --config-file apps/api/pyproject.toml apps/api/src
      - name: Python tests
        run: |
          uv run --package fpl-engine pytest -q packages/fpl_engine/tests
          PYTHONPATH=packages/fpl_engine/src uv run --package api pytest -q apps/api/tests

  # Isolated job so a PostgreSQL integration failure is easy to distinguish
  # from a plain unit-test failure. Uses a disposable CI-only Postgres
  # service database named with the required `_test` suffix so it passes
  # the same ensure_test_database_url safety guard used locally; it is never
  # the development database.
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpl
          POSTGRES_PASSWORD: fpl
          POSTGRES_DB: fpl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpl -d fpl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fpl:fpl@localhost:5432/fpl_test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Python dependencies
        run: uv sync --all-packages --dev
      - name: Apply migrations to test database
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" uv run --package api alembic upgrade head
      - name: PostgreSQL integration tests
        run: PYTHONPATH=packages/fpl_engine/src RUN_DB_TESTS=1 TEST_DATABASE_URL="$TEST_DATABASE_URL" uv run --package api pytest -q apps/api/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm --filter web lint
      - name: Frontend typecheck
        run: pnpm --filter web typecheck
      - name: Frontend unit tests
        run: pnpm --filter web test:run
      - name: Frontend production build
        run: pnpm --filter web build
