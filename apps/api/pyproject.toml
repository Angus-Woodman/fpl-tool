[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.114.1",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "sqlalchemy==2.0.34",
  "alembic==1.13.2",
  "psycopg[binary]==3.2.1",
  "httpx==0.27.2",
  "fpl-engine",
]

[dependency-groups]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "mypy==1.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/fpl_engine/src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:../../packages/fpl_engine/src"
packages = ["api"]

[tool.uv.sources]
fpl-engine = { workspace = true }
