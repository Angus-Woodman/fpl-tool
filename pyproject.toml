[project]
name = "fpl-tool-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.6.8",
  "mypy==1.11.2",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "pre-commit==3.8.0",
]

[tool.uv.workspace]
members = ["apps/api", "packages/fpl_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-q"
